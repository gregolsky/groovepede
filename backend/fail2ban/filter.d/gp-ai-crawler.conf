# Matches nginx access-log lines where we returned 444 (connection closed
# with no response) — which, in this config, only ever happens for a
# User-Agent matched by the $gp_blocked_bot map in nginx/app.conf.template.
#
# Log format is gp_main (nginx/app.conf.template), the stock layout with /v1/
# queries replaced by "?-":
#   $remote_addr - $remote_user [$time_local] "$request_method $gp_log_uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"
#
# Test changes against the live log with:
#   docker compose exec fail2ban fail2ban-regex /var/log/nginx/access.log /data/filter.d/gp-ai-crawler.conf

[Definition]
failregex = ^<HOST> -[^"]*"[^"]*" 444 \d+
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
