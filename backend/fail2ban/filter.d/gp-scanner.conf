# Bans IPs that probe for paths this server does not have.
#
# WHY NOT THE BUILT-IN nginx-botsearch: that filter only matches a fixed
# blocklist (wordpress/phpmyadmin/webmail/cgi-bin — see botsearch-common.conf).
# Tested against real log samples it caught /wp-login.php but MISSED /.env and
# /.git/config, which are the paths actually being probed here.
#
# This server is an API with exactly three valid paths (/v1/album, /v1/artist,
# and /healthz) plus the ACME challenge dir. Nothing legitimate ever 404s, so
# "any 404" is a far better signal than any blocklist can be, and it needs no
# maintenance as scanners change their target lists.
#
# ── Why 301 is matched too ───────────────────────────────────────────────────
# The :80 server block redirects everything to https, so a scanner that sweeps
# port 80 and never follows the redirect only ever produces 301s — it probes
# /.env, /.git/HEAD, /wp-content/... all day and never earns a ban. Measured on
# the live log: 15 IPs had 301s and no 404 at all, i.e. were unbannable.
#
# Two paths are excluded from the 301 rule because they are what a HUMAN typing
# http://<host> into a browser generates, and banning that is a false positive:
#   /            (48 hits in the sample — the bare host)
#   /favicon.ico (5 hits — the browser's automatic follow-up)
# Everything else requested over plain http is someone guessing at paths.
#
# Deliberately does NOT match 403: the resolver returns 403 for a failed token
# signature check, which a real user can hit with clock skew or a stale build.
# Banning on that would lock out legitimate clients.
#
# Test against a real log with:
#   docker compose exec fail2ban fail2ban-regex /var/log/nginx/access.log /data/filter.d/gp-scanner.conf

[Definition]
failregex = ^<HOST> -[^"]*"(GET|POST|HEAD|PUT|DELETE|PATCH|CONNECT|TRACE)[^"]*" 404 \d+
            ^<HOST> -[^"]*"(GET|POST|HEAD|PUT|DELETE|PATCH|CONNECT|TRACE) (?!/ )(?!/favicon\.ico )[^"]*" 301 \d+

# NEVER ban on the ACME challenge path. Let's Encrypt validates over plain
# http from its own servers, and a renewal that races the token write answers
# 404 — which would otherwise ban the validators and break cert renewal
# outright. The cost of the exemption is that a scanner probing under
# /.well-known/acme-challenge/ goes unbanned; that is a trade worth making.
ignoreregex = ^<HOST> -[^"]*"[A-Z]+ /\.well-known/acme-challenge/

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
