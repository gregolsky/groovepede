name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Vite inlines this into the bundle at build time; without it the app
          # signs empty resolver tokens and every request 403s. Add it under
          # Settings → Secrets and variables → Actions → New repository secret.
          VITE_GP_PRIVATE_KEY: ${{ secrets.VITE_GP_PRIVATE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          # Not affected by `defaults.run` — that only applies to `run:` steps.
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    # Opens the real deployed site and clicks through it — catches things
    # stubbed E2E tests can't: signing-key drift (VITE_GP_PRIVATE_KEY vs the
    # Pi's GP_PUBLIC_KEY) and the Pi resolver itself being unreachable.
    # See frontend/tests-smoke/ and frontend/playwright.smoke.config.js.
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:smoke
        env:
          SMOKE_BASE_URL: ${{ needs.deploy.outputs.page_url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          # Not affected by `defaults.run` — that only applies to `run:` steps.
          path: frontend/playwright-report-smoke/
