# Groovepede resolver — self-hosted Raspberry Pi stack.
# Run ./init-letsencrypt.sh once (obtains the cert), then: docker compose up -d
#
# Values come from .env (see .env.example).

services:
  resolver:
    build:
      context: .
      args:
        PUID: ${PUID:-10001}
        PGID: ${PGID:-10001}
    image: gp-resolver-pi
    environment:
      GP_PUBLIC_KEY:   "${GP_PUBLIC_KEY:?set GP_PUBLIC_KEY in .env — from make keygen}"
      ODESLI_KEY:      "${ODESLI_KEY:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      PORT:            "8787"
      DB_PATH:         /data/cache.db
    volumes:
      - ./data:/data
    expose:
      - "8787"          # reachable only inside the compose network; nginx fronts it
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - resolver
    environment:
      DOMAIN:           "${DOMAIN:?set DOMAIN in .env}"
      RATE_LIMIT:       "${RATE_LIMIT:-10r/s}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-20}"
    # Host ports are configurable (nginx still listens on 80/443 INSIDE the
    # container). Defaults 80/443. If you change them, your router must forward
    # public 80 → HTTP_PORT and 443 → HTTPS_PORT — Let's Encrypt HTTP-01 always
    # validates on public port 80, and clients expect 443.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    # Pinned to uid:gid PUID:PGID (default 10001 — matching resolver + certbot,
    # see Dockerfile / .env.example) rather than root or the invoking host user.
    # Tested directly: the stock nginx image otherwise fails outright non-root
    # (can't mkdir /var/cache/nginx/client_temp, can't write /etc/nginx/conf.d —
    # both baked in root-owned). NET_BIND_SERVICE is what lets a non-root
    # process still bind the internal :80/:443 listeners.
    user: "${PUID:-10001}:${PGID:-10001}"
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /var/cache/nginx:uid=${PUID:-10001},gid=${PGID:-10001}
      - /var/run:uid=${PUID:-10001},gid=${PGID:-10001}
      - /etc/nginx/conf.d:uid=${PUID:-10001},gid=${PGID:-10001}
    volumes:
      - ./nginx/app.conf.template:/etc/nginx/templates/app.conf.template:ro
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      # Real logfile (not the image's stdout symlink) so fail2ban can tail it.
      # NOT a tmpfs — fail2ban reads it from another container.
      - ./data/nginx-logs:/var/log/nginx
    restart: unless-stopped
    # We override the command for the reload loop, which makes the nginx image's
    # entrypoint SKIP its envsubst template step (it only templates when the
    # command is `nginx …`). So render the template ourselves, drop the stock
    # default.conf, then run nginx + a 6h reload loop (to pick up renewed certs).
    # The explicit var list means only our vars are substituted; nginx runtime
    # vars ($host, $binary_remote_addr, …) are left intact.
    # The 6h loop also caps the access log at 50MB (one generation kept), so
    # scanner noise can't fill the Pi's SD card. `nginx -s reopen` after the
    # rename is what makes nginx write to the new file instead of the renamed
    # inode.
    #
    # NOTE: single physical line on purpose — YAML folded scalars (`>`) only fold
    # a continuation line into the previous one when it's indented exactly the
    # same as the first content line; anything deeper is kept as a literal
    # newline. That previously split this into three broken commands.
    command: sh -c "rm -f /etc/nginx/conf.d/default.conf; envsubst '$$DOMAIN $$RATE_LIMIT $$RATE_LIMIT_BURST' < /etc/nginx/templates/app.conf.template > /etc/nginx/conf.d/app.conf; while :; do sleep 6h & wait $${!}; if [ -f /var/log/nginx/access.log ] && [ $$(wc -c < /var/log/nginx/access.log) -gt 52428800 ]; then mv -f /var/log/nginx/access.log /var/log/nginx/access.log.1; nginx -s reopen; fi; nginx -s reload; done & exec nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    # Pinned to uid:gid PUID:PGID — the same fixed id as nginx/resolver, so cert
    # files this container writes into the shared ./data/certbot volume are
    # never root-owned (that was the actual bug: root-owned files there blocked
    # the host-side dummy-cert step in init-letsencrypt.sh with a silent
    # permission error). /var/log and /var/lib/letsencrypt are baked in
    # root-owned in the image, so they need their own writable tmpfs too —
    # tested directly.
    user: "${PUID:-10001}:${PGID:-10001}"
    tmpfs:
      - /var/log/letsencrypt:uid=${PUID:-10001},gid=${PGID:-10001}
      - /var/lib/letsencrypt:uid=${PUID:-10001},gid=${PGID:-10001}
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    restart: unless-stopped
    # Attempt renewal every 12h (no-op until ~30 days before expiry).
    # Single physical line — see the nginx `command:` note above for why.
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  # Bans IPs that scan for wp-login/.env/.git etc, and AI crawlers that ignore
  # the 444 from nginx's User-Agent map. Reads nginx's access log; writes
  # iptables rules on the HOST.
  #
  # Deliberately NOT pinned to PUID:PGID like the other three services, and
  # deliberately on host networking with NET_ADMIN — it manipulates the host's
  # iptables, which is impossible from inside the compose network namespace and
  # as an unprivileged user. This is the one privileged container in the stack;
  # it runs no network listener of its own.
  #
  # See fail2ban/jail.d/gp-nginx.conf for why bans must target DOCKER-USER.
  fail2ban:
    image: crazymax/fail2ban:latest
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data/nginx-logs:/var/log/nginx:ro
      - ./fail2ban/jail.d:/data/jail.d:ro
      - ./fail2ban/filter.d:/data/filter.d:ro
      - ./data/fail2ban:/data/db
    environment:
      TZ: "${TZ:-Europe/Warsaw}"
      F2B_DB_PURGE_AGE: "7d"
    restart: unless-stopped
