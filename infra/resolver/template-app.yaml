AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Groovepede Resolver — app-region stack (eu-central-1).
  Deploys the Lambda resolver function (Node 22), its Function URL, and the
  DynamoDB response cache. Deploy this stack FIRST, then the edge stack (us-east-1).

# ── Parameters ────────────────────────────────────────────────────────────────

Parameters:
  GpPublicKey:
    Type: String
    Description: >
      ECDSA-P256 public key (SPKI DER, base64) used by the Lambda to verify signed
      x-gp-token headers. Safe to store in plaintext — it is a public key.
      Generate the key pair with: `make keygen` (see infra/resolver/Makefile).

  OdesliKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional Odesli API key (leave empty to use the free keyless tier).

  CloudFrontDistributionArn:
    Type: String
    Default: ''
    Description: >
      ARN of the CloudFront distribution from the edge stack.
      Leave EMPTY on the first deploy. After the edge stack is deployed, re-run
      `make deploy-app DISTRIBUTION_ARN=<arn>` to lock the Lambda permission to
      the specific distribution (removes the wildcard).

# ── Conditions ────────────────────────────────────────────────────────────────

Conditions:
  HasDistributionArn: !Not [!Equals [!Ref CloudFrontDistributionArn, '']]
  NoDistributionArn:  !Equals [!Ref CloudFrontDistributionArn, '']

# ── Resources ─────────────────────────────────────────────────────────────────

Resources:

  # ── DynamoDB — response cache ──────────────────────────────────────────────
  ResolveCache:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: gp-resolve-cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: k
          AttributeType: S
      KeySchema:
        - AttributeName: k
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: exp
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false   # cache data; no need for PITR

  # ── IAM execution role ─────────────────────────────────────────────────────
  ResolveFnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBCache
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt ResolveCache.Arn

  # ── Lambda function ────────────────────────────────────────────────────────
  ResolveFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: gp-resolver
      Runtime: nodejs22.x
      Handler: handler.handler
      Role: !GetAtt ResolveFnRole.Arn
      # `aws cloudformation package` uploads this zip to S3 and replaces
      # this path with { S3Bucket, S3Key } before deploying.
      Code: .build/handler.zip
      MemorySize: 128
      Timeout: 3
      Architectures:
        - arm64          # Graviton2 — same price tier, ~20% cheaper per ms
      ReservedConcurrentExecutions: 3      # hard cost cap; adjust after load is known
      Environment:
        Variables:
          CACHE_TABLE:   !Ref ResolveCache
          ODESLI_KEY:    !Ref OdesliKey
          GP_PUBLIC_KEY: !Ref GpPublicKey

  # ── Lambda Function URL ────────────────────────────────────────────────────
  ResolveFnUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ResolveFn.Arn
      AuthType: AWS_IAM   # ONLY CloudFront OAC (SigV4-signed) can invoke
      Cors:
        AllowOrigins:
          - 'https://groovepede.gregolsky.pl'
          - 'http://localhost:5173'
        AllowHeaders:
          - 'x-gp-token'
          - 'content-type'
        AllowMethods:
          - GET

  # ── Lambda permission — allow CloudFront to invoke the Function URL ─────────
  # Phase 1 (DISTRIBUTION_ARN empty): wildcard SourceArn — any distribution in
  # this account can call. Acceptable temporarily.
  # Phase 2 (DISTRIBUTION_ARN set): locked to the specific distribution.
  CloudFrontInvokePermissionWildcard:
    Type: AWS::Lambda::Permission
    Condition: NoDistributionArn
    # Complementary pair: exactly one of these two resources is created.
    Properties:
      FunctionName: !GetAtt ResolveFn.Arn
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/*'

  CloudFrontInvokePermissionLocked:
    Type: AWS::Lambda::Permission
    Condition: HasDistributionArn
    Properties:
      FunctionName: !GetAtt ResolveFn.Arn
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Ref CloudFrontDistributionArn

  # ── CloudWatch log group — explicit so we control retention ───────────────
  ResolveFnLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ResolveFn}'
      RetentionInDays: 14

# ── Outputs ───────────────────────────────────────────────────────────────────

Outputs:
  FunctionUrl:
    Description: >
      Lambda Function URL (internal — invoke via CloudFront only; direct access
      requires AWS_IAM SigV4 auth which the browser can't provide).
    Value: !GetAtt ResolveFnUrl.FunctionUrl
    Export:
      Name: gp-resolver-FunctionUrl

  FunctionUrlDomainOnly:
    Description: >
      Just the domain portion of the Function URL (for use as CloudFront origin).
    Value: !Select
      - 2
      - !Split ['/', !GetAtt ResolveFnUrl.FunctionUrl]
    Export:
      Name: gp-resolver-FunctionUrlDomain

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ResolveFn.Arn
    Export:
      Name: gp-resolver-FunctionArn

  CacheTableName:
    Description: DynamoDB cache table name
    Value: !Ref ResolveCache
